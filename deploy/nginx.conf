# /etc/nginx/sites-available/custom-typeform
# Troque forms.seudominio.com.br pelo seu domínio. Depois rode:
#   sudo certbot --nginx -d forms.seudominio.com.br
server {
    listen 80;
    server_name forms.seudominio.com.br;

    client_max_body_size 5m;   # uploads de logo/imagem de fundo (limite do app: 4 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
