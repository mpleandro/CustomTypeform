<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Formulário</title>
  <!--META-->
  <link id="font-link" rel="stylesheet" href="">
  <link rel="stylesheet" href="/static/form.css">
  <script src="/static/route.js"></script>
  <script src="/static/form.js" defer></script>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="progress" role="progressbar" aria-label="Progresso" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span></span></div>
  <header class="top">
    <img class="logo" alt="" hidden>
    <p class="top-label"></p>
    <p class="block-label" aria-live="polite"></p>
  </header>
  <main class="stage" id="stage">
    <noscript><div class="screen is-current"><h1 class="title">Ative o JavaScript para responder.</h1></div></noscript>
  </main>
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <nav class="nav is-hidden" aria-label="Navegação entre perguntas">
    <button class="nav-btn" type="button" data-prev aria-label="Pergunta anterior">↑</button>
    <button class="nav-btn" type="button" data-next aria-label="Próxima pergunta">↓</button>
  </nav>
</body>
</html>
